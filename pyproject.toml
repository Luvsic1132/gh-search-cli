[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghs-cli"
version = "1.0.0"
description = "Search GitHub and vet whether a repo is actually usable: activity, license, platform hints."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Luvsic1132" }]
keywords = ["github", "cli", "search", "open-source", "discovery"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Luvsic1132/gh-search-cli"
Source = "https://github.com/Luvsic1132/gh-search-cli"

[project.scripts]
ghs = "ghs:main"

[tool.setuptools]
py-modules = ["ghs"]
